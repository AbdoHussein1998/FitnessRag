version: '3.8'

services:
  mongodb:
    image: sha256:69b3425389b798d85cc48ef8f4d61449ed018ba1e882c3c3278494dd07caddc6
    container_name: mongodb
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_INITDB_ROOT_USERNAME}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_INITDB_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}
    ports:
      - "${MONGO_PORT}:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - fitness_network
    restart: always

  qdrantdb:
    image: sha256:d9a8a2fc6ae6ba67605052aafb81114269628b356f3cdbfcefaf97ab17d955e7
    container_name: qdrantdb
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
       - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_DB_API_KEY}
      - QDRANT__LOG_LEVEL=INFO
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - fitness_network

volumes:
  mongodb_data:
  qdrant_data:

networks:
  fitness_network:
    driver: bridge
